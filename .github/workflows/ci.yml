# CI do DocSage: lint, testes e scans de segurança.
#
# O GitHub só lê workflows em /.github/workflows, na raiz do repositório. Como o DocSage
# tem repositório próprio, a raiz dele é a raiz do projeto: sem filtro "paths" nem
# "working-directory" (que eram necessários quando ele morava no monorepo).
name: DocSage CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  # Botão "Run workflow" na aba Actions: roda o CI na hora, sem precisar de um push.
  workflow_dispatch:

# Menor privilégio: o token do workflow só pode LER o repositório.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v7

      - name: Configurar Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      # Os testes cobrem apenas funções puras (app/text_utils.py), então instalamos
      # só o necessário — evita baixar PyTorch (~2 GB) a cada execução do CI.
      - name: Instalar dependências de teste
        run: pip install pypdf pytest ruff

      - name: Lint (ruff)
        run: ruff check .

      - name: Testes (pytest)
        run: pytest -q

  security:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v7

      - name: Configurar Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Instalar ferramentas de segurança
        run: pip install pip-audit bandit

      # "continue-on-error" evita quebrar o build por vulnerabilidade em dependência
      # de terceiros. Remova quando quiser que o CI barre o merge nesses casos.
      - name: Scan de vulnerabilidades nas dependências (pip-audit)
        run: pip-audit -r requirements.txt
        continue-on-error: true

      - name: Análise estática de segurança (bandit)
        run: bandit -r app -ll
        continue-on-error: true
